name: CI

on:
  push:
    branches:
      - "feature/**"
      - "fix/**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  tf-validate:
    name: Terraform Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1

      - name: Terraform Fmt Check
        run: terraform fmt -check -recursive
        working-directory: terraform

      - name: Terraform Init Monitoring
        run: terraform init -backend=false -no-color
        working-directory: terraform

      - name: Terraform Validate Monitoring
        run: terraform validate -no-color
        working-directory: terraform

      - name: Validate the telemetry application key
        env:
          DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${DD_APP_KEY}" ]; then
            echo "::error::DD_APP_KEY não está configurado nos segredos do repositório. Sem ela não há plan contra o destino de telemetria -- ver docs/ci-cd.md."
            exit 1
          fi

          echo "DD_APP_KEY presente."

      - name: Configure AWS Credentials
        id: aws_creds
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6.2.1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Plan Monitoring
        if: steps.aws_creds.outcome == 'success'
        working-directory: terraform
        env:
          TF_VAR_datadog_api_key: ${{ secrets.DD_API_KEY }}
          TF_VAR_datadog_app_key: ${{ secrets.DD_APP_KEY }}
          TF_VAR_alert_emails: ${{ vars.ALERT_EMAILS }}
          TF_VAR_environment_online: ${{ vars.ENVIRONMENT_ONLINE == 'true' }}
        run: |
          terraform init -reconfigure -no-color
          terraform plan -no-color

      - name: Note skipped plan in job summary
        if: steps.aws_creds.outcome == 'failure'
        run: |
          {
            echo '### Terraform plan — skipped ⏭️'
            echo ''
            echo 'The AWS lab appears to be unavailable, so `terraform plan` was skipped. **This does not block CI** — `fmt` and `validate` passed, and the Datadog application key was verified. Re-run once the lab is back up to preview the plan.'
          } >> "$GITHUB_STEP_SUMMARY"

  open-pr:
    name: Open Pull Request
    runs-on: ubuntu-latest
    needs:
      - tf-validate
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Generate GitHub App Token
        id: app_token
        uses: actions/create-github-app-token@21cfef2b496dd8ef5b904c159339626a10ad380e # v1.11.0
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
      - name: Open a PR to main if none exists
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          HEAD_BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          existing="$(gh pr list --head "${HEAD_BRANCH}" --base main --state open --json number --jq 'length')"
          if [[ "${existing}" != "0" ]]; then
            echo "An open PR already exists for ${HEAD_BRANCH} -> main; nothing to do."
            exit 0
          fi
          gh pr create \
            --base main \
            --head "${HEAD_BRANCH}" \
            --title "${HEAD_BRANCH}" \
            --body "Automated PR opened by CI on behalf of @${ACTOR} after all checks passed on \`${HEAD_BRANCH}\`."
